<footer>
  <div class="content">
    <a class="logo" routerLink="/" [attr.aria-label]="'common.home' | translate">
      <img src="/icons/logo_placeholder.gif" alt="" width="57" height="72" loading="lazy" />
    </a>

    <app-social-links variant="footer" />

    <div class="legal">
      <nav [attr.aria-label]="'footer.legal' | translate">
        <ul class="legal-links">
          <li>
            <a routerLink="/legal-notice"><app-stable-text key="footer.legalNotice" /></a>
          </li>
          <li>
            <a routerLink="/privacy-policy"><app-stable-text key="footer.privacyPolicy" /></a>
          </li>
        </ul>
      </nav>

      <p class="copyright">&copy; Blub {{ currentYear }}</p>
    </div>
  </div>
</footer>
