<header>
  <nav class="content" [attr.aria-label]="'nav.ariaLabel' | translate">
    <a
      class="logo"
      routerLink="/"
      [attr.aria-label]="'common.home' | translate"
      (click)="closeMenu()"
    >
      <img src="/icons/logo_placeholder.gif" alt="" width="57" height="72" />
    </a>

    <button
      class="burger"
      type="button"
      aria-controls="main-menu"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="(isMenuOpen() ? 'nav.closeMenu' : 'nav.openMenu') | translate"
      (click)="toggleMenu()"
    >
      @if (isMenuOpen()) {
        <img src="/icons/close_menu.svg" alt="" width="35" height="32" />
      } @else {
        <img src="/icons/burger_menu.svg" alt="" width="32" height="32" />
      }
    </button>

    <div id="main-menu" class="menu" [class.open]="isMenuOpen()">
      <ul class="nav-links">
        <li>
          <a routerLink="/" fragment="about" (click)="closeMenu()">
            <app-stable-text key="nav.about" />
          </a>
        </li>
        <li>
          <a routerLink="/" fragment="skills" (click)="closeMenu()">
            <app-stable-text key="nav.skills" />
          </a>
        </li>
        <li>
          <a routerLink="/" fragment="projects" (click)="closeMenu()">
            <app-stable-text key="nav.projects" />
          </a>
        </li>
        <li>
          <a routerLink="/" fragment="contact" (click)="closeMenu()">
            <app-stable-text key="nav.contact" />
          </a>
        </li>
      </ul>

      <div class="language-switch" role="group" [attr.aria-label]="'nav.language' | translate">
        @for (language of languages; track language.code) {
          <button
            type="button"
            [class.active]="currentLang() === language.code"
            [attr.aria-pressed]="currentLang() === language.code"
            [attr.aria-label]="language.labelKey | translate"
            (click)="setLanguage(language.code)"
          >
            {{ language.code | uppercase }}
          </button>
        }
      </div>
    </div>
  </nav>
</header>
