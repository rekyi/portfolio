<div
  class="viewport"
  (pointerdown)="handlePointerDown($event)"
  (pointerup)="handlePointerUp($event)"
>
  <ul class="track" [style.translate]="trackOffset()">
    @for (image of images(); track image.src; let index = $index) {
      <li class="slide" [attr.aria-hidden]="index !== currentIndex()">
        <img
          [src]="image.src"
          [alt]="'projects.previewAlt' | translate: { title: (titleKey() | translate) }"
          [width]="image.width"
          [height]="image.height"
          loading="lazy"
          draggable="false"
        />
      </li>
    }
  </ul>
</div>

@if (hasMultipleImages()) {
  <div class="dots">
    @for (image of images(); track image.src; let index = $index) {
      <button
        type="button"
        class="dot"
        [class.is-active]="index === currentIndex()"
        [attr.aria-current]="index === currentIndex()"
        [attr.aria-label]="'projects.showImage' | translate: { number: index + 1 }"
        (click)="showSlide(index)"
      ></button>
    }
  </div>
}
