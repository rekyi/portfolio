<div
  class="viewport"
  (pointerdown)="handlePointerDown($event)"
  (pointerup)="handlePointerUp($event)"
>
  <ul class="track" [style.translate]="trackOffset()">
    @for (image of images(); track image; let index = $index) {
      <li class="slide" [attr.aria-hidden]="index !== currentIndex()">
        <img
          [src]="image"
          [alt]="'projects.previewAlt' | translate: { title: (titleKey() | translate) }"
          width="1200"
          height="800"
          loading="lazy"
          draggable="false"
        />
      </li>
    }
  </ul>
</div>

@if (hasMultipleImages()) {
  <div class="dots">
    @for (target of dotTargets(); track target; let dot = $index) {
      <button
        type="button"
        class="dot"
        [class.is-active]="dot === activeDot()"
        [attr.aria-current]="dot === activeDot()"
        [attr.aria-label]="'projects.showImage' | translate: { number: target + 1 }"
        (click)="showSlide(target)"
      ></button>
    }
  </div>
}
