<section id="projects">
  <app-section-title><app-stable-text key="projects.title" /></app-section-title>

  <div class="tabs" role="tablist">
    @for (project of projects; track $index) {
      <button
        type="button"
        role="tab"
        class="tab"
        [class.is-active]="$index === activeIndex()"
        [attr.aria-selected]="$index === activeIndex()"
        (click)="activeIndex.set($index)"
      >
        {{ $index + 1 }}.
        <span class="tab-mobile"><app-stable-text key="projects.tab" /></span>
        <span class="tab-desktop"><app-stable-text [key]="project.titleKey" /></span>
      </button>
    }
  </div>

  <div
    class="tab-panel"
    role="tabpanel"
    [class.is-first-active]="activeIndex() === 0"
    [class.is-last-active]="activeIndex() === projects.length - 1"
  >
    @for (project of projects; track $index) {
      <app-project-card
        class="card"
        [project]="project"
        [class.is-active]="$index === activeIndex()"
        [class.is-removed]="isCardRemoved($index)"
      />
    }
  </div>
</section>
