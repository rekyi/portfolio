<section id="hero" class="content">
  <div class="portrait">
    <img
      src="/images/pic_placeholder.png"
      [alt]="'hero.portraitAlt' | translate"
      width="580"
      height="680"
      fetchpriority="high"
    />
  </div>

  <div class="intro">
    <app-logo class="logo" [isAnimated]="true" />
    <h1>Blub</h1>
    <p class="job-title"><app-stable-text key="hero.jobTitle" /></p>
    <a
      class="scroll-down"
      routerLink="/"
      fragment="about"
      [attr.aria-label]="'hero.scrollDown' | translate"
    >
      <svg viewBox="0 0 16 34" width="16" height="34" aria-hidden="true">
        <use href="/icons/arrow_mob.svg#icon" />
      </svg>
    </a>

    <app-social-links class="social" />
  </div>
</section>
