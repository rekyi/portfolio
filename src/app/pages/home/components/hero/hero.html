<section id="hero" class="content">
  <div class="portrait">
    <img
      src="/images/pic_placeholder.png"
      [alt]="'hero.portraitAlt' | translate"
      width="580"
      height="680"
      fetchpriority="high"
    />
  </div>

  <div class="intro">
    <img class="logo" src="/icons/logo_placeholder.gif" alt="" width="57" height="72" />
    <h1>Blub</h1>
    <p class="job-title"><app-stable-text key="hero.jobTitle" /></p>
    <a
      class="scroll-down"
      routerLink="/"
      fragment="about"
      [attr.aria-label]="'hero.scrollDown' | translate"
    >
      <img src="/icons/arrow_mob.svg" alt="" width="16" height="34" />
    </a>

    <app-social-links class="social" />
  </div>
</section>
