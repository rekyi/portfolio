<section id="about" class="content">
  <app-section-title><app-stable-text key="about.title" /></app-section-title>

  <div class="about-body">
    <div class="statement">
      <div class="icon" [class]="activeStatement().id" [class.is-visible]="isIconVisible()">
        <img
          [src]="activeStatement().icon"
          alt=""
          [width]="activeStatement().iconWidth"
          [height]="activeStatement().iconHeight"
          loading="lazy"
        />
      </div>
      <p>
        <span class="highlight">{{ 'about.iAm' | translate }}</span
        ><span class="typed">{{ typedText() }}</span>
      </p>
    </div>

    <div class="text">
      <p><app-stable-text key="about.question" /></p>
      <p><app-stable-text key="about.text" /></p>
      <a appPrimaryButton variant="secondary" class="cta-btn" routerLink="/" fragment="contact">
        <app-stable-text key="common.letsTalk" />
      </a>
    </div>
  </div>
</section>
