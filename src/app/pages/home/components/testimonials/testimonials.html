<section id="testimonials" class="content">
  <h2 class="title">
    <app-stable-text [key]="['testimonials.title', 'testimonials.subtitle']">
      <ng-template let-texts="texts">
        {{ texts[0] }} <span class="subtitle">{{ texts[1] }}</span>
      </ng-template>
    </app-stable-text>
  </h2>

  <div class="cards">
    @for (testimonial of testimonials; track $index) {
      <app-testimonial-card class="card" [testimonial]="testimonial" />
    }
  </div>
</section>
