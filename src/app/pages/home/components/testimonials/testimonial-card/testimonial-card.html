<article class="testimonial-card">
  <h3 class="name">{{ testimonial().name }}</h3>
  <p class="project">
    <app-stable-text key="testimonials.project">
      <ng-template let-label>
        {{ label }} <span class="project-name">{{ testimonial().project }}</span>
      </ng-template>
    </app-stable-text>
  </p>
  <p class="quote">
    <app-stable-text [key]="testimonial().quoteKey">
      <ng-template let-quote><q>{{ quote }}</q></ng-template>
    </app-stable-text>
  </p>
  <a
    class="linkedin-link"
    [href]="testimonial().linkedinUrl"
    target="_blank"
    rel="noopener noreferrer"
  >
    <app-stable-text key="testimonials.linkedin" />
  </a>
</article>
