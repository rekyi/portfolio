<section id="skills" class="content">
  <app-section-title><app-stable-text key="skills.title" /></app-section-title>

  <div class="skills-body">
    <ul class="skill-list">
      @for (skill of skills; track skill.name) {
        <li class="skill">
          @if (skill.icon; as icon) {
            <img
              [src]="icon.src"
              alt=""
              [width]="icon.width"
              [height]="icon.height"
              loading="lazy"
            />
          }
          <span class="skill-name">{{ skill.name }}</span>
        </li>
      }
    </ul>

    <div class="learning">
      <p class="learning-title">
        <span class="title-mobile"><app-stable-text key="skills.learningTitleMobile" /></span>
        <span class="title-desktop"><app-stable-text key="skills.learningTitleDesktop" /></span>
      </p>
      @if (learningSkills.length > 0) {
        <ul class="learning-list">
          @for (skill of learningSkills; track skill.name) {
            <li class="skill">
              @if (skill.icon; as icon) {
                <img
                  [src]="icon.src"
                  alt=""
                  [width]="icon.width"
                  [height]="icon.height"
                  loading="lazy"
                />
              }
              <span class="skill-name">{{ skill.name }}</span>
            </li>
          }
        </ul>
      }
      <p class="learning-text"><app-stable-text key="skills.learningText" /></p>
    </div>
  </div>

  <a appPrimaryButton class="cta-btn" routerLink="/" fragment="contact">
    <app-stable-text key="common.letsTalk" />
  </a>
</section>
